name: Release desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: log-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: log-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version."
          }

      - name: Build release
        run: npm run build

      - name: Smoke test packaged SQLite
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $executable = Join-Path "release/$version/win-unpacked" "log-app.exe"
          $env:SQLITE_DB_PATH = Join-Path $env:RUNNER_TEMP "log-app-smoke-test.db"
          $process = Start-Process -FilePath $executable -ArgumentList "--database-smoke-test" -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Packaged SQLite smoke test failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path -LiteralPath $env:SQLITE_DB_PATH)) {
            throw "Packaged app did not create the SQLite database."
          }

          if ((Get-Item -LiteralPath $env:SQLITE_DB_PATH).Length -eq 0) {
            throw "Packaged app created an empty SQLite database."
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = Get-ChildItem -Path "release/$version" -File | Select-Object -ExpandProperty FullName

          if (-not $assets) {
            throw "No release assets were generated."
          }

          gh release create "${{ github.ref_name }}" @assets --title $version --generate-notes --verify-tag
